[package]
name = "cryptomeria-historic"
version = "0.0.1"
edition = "2024"
description = "NNG PUB/SUB subscriber that forwards normalised LOB/trade market data to QuestDB with embedded schema migrations."
license = "Apache-2.0"
repository = "https://github.com/fibonsai/cryptomeria-historic"
categories = ["command-line-utilities", "database"]
keywords = ["crypto", "market-data", "historical", "trading", "questdb", "nng"]

[lib]
name = "cryptomeria_historic"
path = "src/lib.rs"

[[bin]]
name = "cryptomeria-historic"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
cryptomeria-nng-client = { git = "https://github.com/fibonsai/cryptomeria-nng-client", branch = "main" }
questdb-rs = { path = "vendor/questdb-rs", default-features = false, features = ["chrono-timestamp", "sync-sender", "sync-reader", "tls-webpki-certs", "ring-crypto"] }
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
testcontainers = { version = "0.28", default-features = false, features = ["blocking"] }
serial_test = "2"

[profile.release]
lto = true
codegen-units = 1
